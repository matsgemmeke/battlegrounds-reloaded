name: SV-98
gun-type: SNIPER_RIFLE
description: Bolt-action sniper rifle. Effective at long range.
level-unlocked: 27
price: 4750
controls:
  shoot:
    action: RIGHT_CLICK
    priority: 2
    blocking: true
    cancels-event: true
  reload:
    action: LEFT_CLICK
    priority: 2
    blocking: true
    cancels-event: true
  scope-use:
    action: RIGHT_CLICK
    priority: 1
    stops-chain: true
    blocking: true
    cancels-event: true
  scope-stop:
    action: LEFT_CLICK
    priority: 1
    stops-chain: true
    blocking: true
    cancels-event: true
  scope-change-magnification:
    action: SWAP_FROM
    blocking: true
    cancels-event: true
ammo:
  magazine-size: 10
  default-magazine-amount: 3
  max-magazine-amount: 8
item:
  material: IRON_HOE
  display-name: '&f%name% %magazine_ammo%/%reserve_ammo%'
  damage: 32
  item-flags:
    - HIDE_ATTRIBUTES
    - HIDE_UNBREAKABLE
  data:
    weapon-type:
      key: weapon-type
      type: STRING
      value: GUN
    weapon-name:
      key: weapon-name
      type: STRING
      value: SV-98
  unbreakable: true
reloading:
  type: MAGAZINE
  duration: 60
  sound-sequence: sniper-rifle-reload-1
scope:
  magnifications: [-0.1, -0.2]
  use-sound-sequence: sniper-rifle-scope-use-1
  stop-sound-sequence: sniper-rifle-scope-stop-1
  change-magnification-sound-sequence: sniper-rifle-scope-change-magnification-1
shooting:
  fire-mode:
    type: SEMI_AUTOMATIC
    cycle-cooldown: 20
  projectile:
    type: HITSCAN
    sound-sequence: sniper-rifle-shoot-1
    sound-suppressed-sequence: sniper-rifle-shoot-suppressed-1
    effect:
      type: DAMAGE
      damage-type: BULLET_DAMAGE
      range:
        short-range:
          damage: 98.0
          distance: 180.0
        medium-range:
          damage: 98.0
          distance: 190.0
        long-range:
          damage: 98.0
          distance: 200.0
      hitbox-damage-profile:
        head: 2.0
        torso: 1
        limbs: 0.8
    trajectory-particle-effect:
      particle: DUST
      count: 1
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      extra: 0
      dust-options:
        color: '#ffffff'
        size: 1
  recoil:
    type: CAMERA_MOVEMENT
    horizontal: [1.0, 1.5, 2.0]
    vertical: [-4.0, -4.5, -5.0]
    kickback-duration: 200
    recovery-rate: 0.8
    recovery-duration: 300
  spread-pattern:
    type: SINGLE_PROJECTILE
