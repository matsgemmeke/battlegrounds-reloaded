name: Python
gun-type: HANDGUN
description: Double-action revolver pistol. Uses a 6 round cylinder feed system.
level-unlocked: 18
price: 600
controls:
  shoot:
    action: RIGHT_CLICK
    blocking: true
    cancels-event: true
  reload:
    action: LEFT_CLICK
    blocking: true
    cancels-event: true
ammo:
  max-magazine-amount: 8
  default-magazine-amount: 3
  magazine-size: 6
item:
  material: IRON_HOE
  display-name: '&f%name% %magazine_ammo%/%reserve_ammo%'
  damage: 5
  item-flags:
    - HIDE_ATTRIBUTES
    - HIDE_UNBREAKABLE
  data:
    weapon-type:
      key: weapon-type
      type: STRING
      value: GUN
    weapon-name:
      key: weapon-name
      type: STRING
      value: Python
  unbreakable: true
reloading:
  type: MANUAL_INSERTION
  duration: 16
  sound-sequence: handgun-reload-2
shooting:
  fire-mode:
    type: SEMI_AUTOMATIC
    cycle-cooldown: 4
  projectile:
    type: HITSCAN
    sound-sequence: handgun-shoot-1
    sound-suppressed-sequence: handgun-shoot-suppressed-1
    effect:
      type: DAMAGE
      damage-type: BULLET_DAMAGE
      range:
        short-range:
          damage: 50.0
          distance: 10.0
        medium-range:
          damage: 40.0
          distance: 30.0
        long-range:
          damage: 30.0
          distance: 50.0
      hitbox-damage-profile:
        head: 1.5
        torso: 1
        limbs: 0.5
    trajectory-particle-effect:
      particle: DUST
      count: 1
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      extra: 0
      dust-options:
        color: '#ffffff'
        size: 1
  recoil:
    type: CAMERA_MOVEMENT
    horizontal: [0.0, 0.5, 1.0]
    vertical: [-3.0, -3.5, -4.0]
    kickback-duration: 200
  spread-pattern:
    type: SINGLE_PROJECTILE
