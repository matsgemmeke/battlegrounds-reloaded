name: China Lake
gun-type: GRENADE_LAUNCHER
description: Pump action grenade launcher. Delivers great direct impact damage.
level-unlocked: 25
price: 3000
controls:
  shoot:
    action: RIGHT_CLICK
    blocking: true
    cancels-event: true
  reload:
    action: LEFT_CLICK
    blocking: true
    cancels-event: true
ammo:
  magazine-size: 3
  default-magazine-amount: 1
  max-magazine-amount: 2
item:
  material: IRON_HOE
  display-name: '&f%name% %magazine_ammo%/%reserve_ammo%'
  damage: 33
  item-flags:
    - HIDE_ATTRIBUTES
    - HIDE_UNBREAKABLE
  data:
    weapon-type:
      key: weapon-type
      type: STRING
      value: GUN
    weapon-name:
      key: weapon-name
      type: STRING
      value: China Lake
  unbreakable: true
reloading:
  type: MANUAL_INSERTION
  duration: 30
  sound-sequence: grenade-launcher-reload-1
shooting:
  fire-mode:
    type: SEMI_AUTOMATIC
    cycle-cooldown: 20
  projectile:
    type: ITEM
    item:
      material: SHEARS
      damage: 1
    velocity: 2.5
    pickup-delay: 10000
    sound-sequence: grenade-launcher-shoot-1
    effect:
      type: EXPLOSION
      power: 2.0
      spread-fire: false
      damage-blocks: false
      range:
        long-range:
          damage: 25.0
          distance: 7.5
        medium-range:
          damage: 75.0
          distance: 5.0
        short-range:
          damage: 150.0
          distance: 2.5
    triggers:
      impact:
        type: BLOCK_IMPACT
        delay: 0
        interval: 1
  recoil:
    type: CAMERA_MOVEMENT
    horizontal: [-1.0, 0.5, 1.0]
    vertical: [-4.0, -5.0, -6.0]
    kickback-duration: 300
  spread-pattern:
    type: SINGLE_PROJECTILE
