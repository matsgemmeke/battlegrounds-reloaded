name: FAMAS
gun-type: ASSAULT_RIFLE
description: Fully automatic with high rate of fire. Effective at medium range.
level-unlocked: 5
price: 2250
controls:
  shoot:
    action: RIGHT_CLICK
    blocking: true
    cancels-event: true
  reload:
    action: LEFT_CLICK
    blocking: true
    cancels-event: true
ammo:
  magazine-size: 30
  default-magazine-amount: 3
  max-magazine-amount: 8
item:
  material: IRON_HOE
  display-name: '&f%name% %magazine_ammo%/%reserve_ammo%'
  damage: 16
  item-flags:
    - HIDE_ATTRIBUTES
    - HIDE_UNBREAKABLE
  data:
    weapon-type:
      key: weapon-type
      type: STRING
      value: GUN
    weapon-name:
      key: weapon-name
      type: STRING
      value: FAMAS
  unbreakable: true
reloading:
  type: MAGAZINE
  duration: 54
  sound-sequence: assault-rifle-reload-1
shooting:
  fire-mode:
    type: FULLY_AUTOMATIC
    rate-of-fire: 600
  projectile:
    type: HITSCAN
    sound-sequence: assault-rifle-shoot-2
    sound-suppressed-sequence: assault-rifle-shoot-suppressed-1
    effect:
      type: DAMAGE
      damage-type: BULLET_DAMAGE
      range:
        short-range:
          damage: 35.0
          distance: 20.0
        medium-range:
          damage: 30.0
          distance: 50.0
        long-range:
          damage: 25.0
          distance: 80.0
      hitbox-damage-profile:
        head: 1.5
        torso: 1
        limbs: 0.7
    trajectory-particle-effect:
      particle: DUST
      count: 1
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      extra: 0
      dust-options:
        color: '#ffffff'
        size: 1
  recoil:
    type: CAMERA_MOVEMENT
    horizontal: [0.0, 0.5, 1.0]
    vertical: [-2.0, -2.5, -3.0]
    kickback-duration: 200
  spread-pattern:
    type: SINGLE_PROJECTILE
